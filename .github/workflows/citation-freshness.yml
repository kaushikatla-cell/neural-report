# Strict run: failing workflow = triage time (some .gov hosts block datacenter IPs).
# Advisory checks stay in external-links.yml (continue-on-error).
name: Citation freshness (strict + snapshots)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 3"

permissions:
  contents: read
  issues: write

jobs:
  external-link-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Snapshot external links (strict on new failures)
        run: python3 scripts/snapshot_external_links.py --strict-new
      - name: Create/update issue for new failures
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- link-audit:external-failures -->';
            const path = 'metrics/link-audit/new-failures.json';
            if (!fs.existsSync(path)) {
              core.info('new-failures.json missing; skipping.');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const failures = data.new_failures || [];
            if (failures.length === 0) {
              core.info('No new failures; no issue changes needed.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const shortTs = (data.timestamp || '').slice(0, 10) || 'unknown-date';
            const title = `[Link Audit] New external link failures (${shortTs})`;
            const list = failures.slice(0, 50).map((u) => `- ${u}`).join('\n');
            const extra = failures.length > 50 ? `\n- ...and ${failures.length - 50} more` : '';
            const body = `${marker}

            Automated external-link audit detected **${failures.length} new failing URL(s)**.

            **Timestamp:** \`${data.timestamp}\`
            **Run:** https://github.com/${owner}/${repo}/actions/runs/${context.runId}

            ## New failures
            ${list}${extra}

            ## Next actions
            - Verify if failures are transient (rate limits / bot blocks).
            - If persistent, update or replace broken citations in \`docs/briefs/\`.
            - Re-run \`python3 scripts/snapshot_external_links.py\` locally.
            `;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find((i) => i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body
              });
              core.info(`Updated existing link-audit issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created link-audit issue #${created.data.number}`);
            }
      - name: Upload link-audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-${{ github.run_id }}
          path: |
            metrics/link-audit/latest.json
            metrics/link-audit/new-failures.json
            metrics/link-audit/latest-delta.md
            metrics/link-audit/snapshots/*.json
