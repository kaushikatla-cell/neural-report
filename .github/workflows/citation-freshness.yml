# Strict run: failing workflow = triage time (some .gov hosts block datacenter IPs).
# Advisory checks stay in external-links.yml (continue-on-error).
name: Citation freshness (strict external links)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 3"

jobs:
  lychee-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external URLs (fail job on dead links)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config lychee.toml --no-progress './docs/**/*.html'
