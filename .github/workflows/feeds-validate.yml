name: Site outputs match sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system fonts (OG image text)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Regenerate feeds and sitemap
        run: python3 scripts/generate_feeds.py
      - name: Validate site manifest schema/invariants
        run: python3 scripts/check_manifest.py
      - name: Sync index/archive from manifest
        run: python3 scripts/sync_site_pages.py
      - name: Generate dashboard and transparency pages
        run: |
          python3 scripts/generate_dashboard.py
          python3 scripts/generate_library_page.py
          python3 scripts/generate_search_index.py
          python3 scripts/generate_transparency_page.py
      - name: Regenerate OG images and sync brief meta
        run: python3 scripts/generate_og_images.py
      - name: Fail if generated files differ from commit
        run: |
          git diff --stat
          mapfile -t og_pngs < <(find docs/images/og -name '*.png' 2>/dev/null | sort)
          git diff --exit-code docs/rss.xml docs/atom.xml docs/sitemap.xml \
            docs/index.html docs/archive.html docs/dashboard.html docs/library.html docs/transparency.html docs/search-index.json \
            docs/images/og-default.png \
            "${og_pngs[@]}" \
            docs/briefs/*.html
      - name: Validate internal HTML hrefs
        run: python3 scripts/check_docs.py
      - name: Validate editorial brief quality
        run: python3 scripts/check_briefs.py
