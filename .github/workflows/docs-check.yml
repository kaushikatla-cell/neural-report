name: Docs check

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/docs-check.yml"
  # Manifest edits are validated in feeds-validate.yml (feeds + OG image outputs).

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify internal hrefs
        run: python3 scripts/check_docs.py
